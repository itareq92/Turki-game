<title>رحلة دمعة اللبان</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&display=swap">
<style>
/* Layout: one 16:9 clay stage scaled to fit the screen; an RTL DOM layer in stage pixels carries Arabic cards and buttons */
:root{
  --sky:#CFE4E4; --cream:#FFF9EE; --ink:#2D3D31; --deep:#2F5A3E; --leaf:#5E8F4E;
  --coral:#E4643F; --coral-d:#B94A2B; --gold:#F1CF6B; --sand:#EBD8AE; --wood:#B98457;
  --c-plant:#3B97AC; --c-parts:#D99A1E; --c-use:#8C5FBD; --c-imp:#D24E68; --c-benefit:#4B9650;
  --font:'Baloo Bhaijaan 2','Tajawal','Segoe UI',Tahoma,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--font);overflow:hidden;box-sizing:border-box;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#app{position:relative;width:100%;height:100%;overflow:hidden;touch-action:none}
#c{position:absolute;border-radius:22px;box-shadow:0 10px 40px rgba(47,90,62,.18);touch-action:none}
#ui{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;pointer-events:none;direction:rtl;overflow:hidden;border-radius:22px}
#ui > *{pointer-events:auto}
#ui .pass{pointer-events:none}

.btn{font:800 34px/1 var(--font);color:#fff;background:var(--coral);border:0;border-radius:999px;padding:18px 52px 24px;cursor:pointer;
  box-shadow:inset 0 -8px 0 rgba(0,0,0,.16),inset 0 6px 10px rgba(255,255,255,.35),0 10px 22px rgba(160,60,30,.32);transition:transform .12s}
.btn:active{transform:translateY(4px) scale(.98)}
.btn:focus-visible,.round:focus-visible,.stop:focus-visible{outline:5px solid var(--deep);outline-offset:4px}
.btn.green{background:var(--c-benefit);box-shadow:inset 0 -8px 0 rgba(0,0,0,.16),inset 0 6px 10px rgba(255,255,255,.35),0 10px 22px rgba(40,90,40,.3)}

.round{position:absolute;top:22px;width:78px;height:78px;border-radius:50%;border:0;background:var(--cream);cursor:pointer;display:grid;place-items:center;
  box-shadow:inset 0 -6px 0 rgba(120,100,60,.14),inset 0 5px 8px #fff,0 8px 18px rgba(47,90,62,.22)}
.round svg{width:40px;height:40px}
.round:active{transform:translateY(3px)}
.home{right:24px}.snd{left:24px}

.prompt{position:absolute;top:26px;left:50%;transform:translateX(-50%);background:var(--cream);border-radius:999px;padding:12px 40px 16px;
  font:800 36px/1.25 var(--font);color:var(--deep);white-space:nowrap;box-shadow:inset 0 -6px 0 rgba(120,100,60,.12),inset 0 5px 8px #fff,0 10px 24px rgba(47,90,62,.2)}
.prompt b{color:var(--coral)}
.hints{position:absolute;top:118px;left:50%;transform:translateX(-50%);display:flex;gap:14px;white-space:nowrap}
.hints span{background:rgba(255,249,238,.88);border-radius:999px;padding:6px 22px 9px;font:700 25px/1.2 var(--font);color:var(--ink);box-shadow:0 6px 14px rgba(47,90,62,.14)}

.card{position:absolute;left:50%;top:50%;width:900px;max-height:660px;transform:translate(-50%,-50%);background:var(--cream);border-radius:48px;
  padding:34px 56px 38px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:right;
  box-shadow:0 26px 60px rgba(30,60,40,.32),inset 0 -10px 0 rgba(120,100,60,.10),inset 0 8px 12px #fff;animation:pop .45s cubic-bezier(.2,1.6,.4,1) both}
.veil{position:absolute;inset:0;background:rgba(40,70,50,.28)}
.chip{font:800 24px/1 var(--font);color:#fff;border-radius:999px;padding:10px 26px 13px;box-shadow:inset 0 -5px 0 rgba(0,0,0,.14),inset 0 4px 6px rgba(255,255,255,.3)}
.card h2{margin:0;font:800 50px/1.15 var(--font);color:var(--deep);text-align:center;text-wrap:balance}
.card ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;align-self:stretch}
.card li{font:600 28px/1.45 var(--font);display:flex;gap:16px;align-items:flex-start}
.card li::before{content:"";flex:none;width:20px;height:20px;margin-top:13px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff8 0 18%,transparent 40%),var(--dot,var(--leaf));box-shadow:0 3px 5px rgba(0,0,0,.15)}
.card li b{color:var(--deep);font-weight:800}
.card .sci{font:600 22px/1.3 var(--font);color:#6b7a6c;direction:ltr;unicode-bidi:isolate}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 28px;align-self:stretch}
.grid div{background:#F6EEDC;border-radius:24px;padding:12px 20px 14px;font:600 24px/1.4 var(--font)}
.grid div b{display:block;font:800 27px/1.2 var(--font);color:var(--deep);margin-bottom:2px}
.card .btn{margin-top:8px}
.stat{font:800 28px/1.2 var(--font);color:var(--coral-d)}

.tag{position:absolute;background:var(--cream);border-radius:999px;padding:6px 20px 9px;font:800 24px/1.1 var(--font);color:var(--deep);box-shadow:0 8px 18px rgba(47,90,62,.2);white-space:nowrap;animation:pop .35s cubic-bezier(.2,1.6,.4,1) both}

.list{position:absolute;right:56px;top:150px;width:330px;display:flex;flex-direction:column;gap:12px}
.list div{background:rgba(255,249,238,.72);border-radius:26px;padding:10px 24px 13px;font:800 30px/1.2 var(--font);color:#8a978b;display:flex;justify-content:space-between;align-items:center;box-shadow:0 6px 14px rgba(47,90,62,.1)}
.list div.now{background:var(--cream);color:var(--deep);box-shadow:0 0 0 5px var(--c-parts),0 10px 22px rgba(47,90,62,.2)}
.list div.done{background:#E3F0D6;color:var(--leaf)}
.list i{font-style:normal;width:34px;height:34px;border-radius:50%;background:var(--c-benefit);display:grid;place-items:center}
.list i svg{width:20px;height:20px}

.counter{position:absolute;top:22px;left:122px;background:var(--cream);border-radius:999px;padding:10px 28px 14px;font:800 34px/1 var(--font);color:var(--deep);box-shadow:0 8px 18px rgba(47,90,62,.2);display:flex;gap:12px;align-items:center}
.counter img{width:36px;height:36px}
.big{position:absolute;left:50%;top:150px;transform:translateX(-50%);font:800 90px/1 var(--font);color:var(--cream);text-shadow:0 6px 0 rgba(47,90,62,.35),0 12px 30px rgba(0,0,0,.25)}
.bar{position:absolute;top:120px;left:50%;transform:translateX(-50%);width:640px;height:26px;border-radius:99px;background:rgba(255,249,238,.8);box-shadow:inset 0 3px 6px rgba(0,0,0,.12)}
.bar i{position:absolute;right:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(#F6D785,#E7B64A);box-shadow:inset 0 -4px 0 rgba(0,0,0,.1)}
.bar span{position:absolute;top:34px;font:800 22px/1 var(--font);color:var(--deep);white-space:nowrap}
.toast{position:absolute;left:50%;top:176px;transform:translateX(-50%);max-width:900px;background:var(--cream);border-radius:30px;padding:14px 34px 18px;font:700 28px/1.4 var(--font);color:var(--ink);text-align:center;box-shadow:0 12px 26px rgba(47,90,62,.25);animation:pop .4s cubic-bezier(.2,1.6,.4,1) both}
.toast b{color:var(--c-imp)}
.bubble{position:absolute;width:300px;transform:translate(-50%,-100%);background:var(--cream);border-radius:26px;padding:12px 20px 14px;font:700 23px/1.4 var(--font);text-align:center;box-shadow:0 10px 22px rgba(47,90,62,.25);animation:pop .35s cubic-bezier(.2,1.6,.4,1) both}
.bubble b{display:block;color:var(--c-benefit);font-size:27px}
.bubble::after{content:"";position:absolute;bottom:-14px;left:50%;margin-left:-14px;border:14px solid transparent;border-bottom:0;border-top-color:var(--cream)}

/* title */
.title{position:absolute;right:70px;top:40px;width:620px;display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.eyebrow{font:800 24px/1 var(--font);color:#fff;background:var(--c-benefit);border-radius:999px;padding:10px 24px 13px;box-shadow:inset 0 -5px 0 rgba(0,0,0,.14)}
.title h1{margin:6px 0 0;font:800 100px/1.02 var(--font);color:var(--deep);letter-spacing:0;
  text-shadow:0 2px 0 #fff8,0 6px 0 #9fc48b,0 9px 0 #7fa86b,0 18px 26px rgba(30,60,40,.25)}
.title h1 em{font-style:normal;color:var(--coral)}
.title p{margin:0 0 12px;font:700 34px/1.35 var(--font);color:var(--ink)}
.plaque{position:absolute;right:60px;bottom:34px;background:linear-gradient(#D7A274,#BF8759);border-radius:28px;padding:14px 34px 18px;color:#FFF7E8;text-align:right;
  box-shadow:inset 0 -7px 0 rgba(0,0,0,.14),inset 0 5px 8px rgba(255,255,255,.28),0 12px 24px rgba(90,55,25,.3)}
.plaque small{display:block;font:600 21px/1.3 var(--font);opacity:.92}
.plaque strong{display:block;font:800 31px/1.3 var(--font)}

/* map */
.stop{position:absolute;width:132px;height:132px;margin:-66px 0 0 -66px;border-radius:50%;border:0;padding:0;cursor:pointer;background:var(--col);
  box-shadow:inset 0 -9px 0 rgba(0,0,0,.18),inset 0 7px 10px rgba(255,255,255,.35),0 14px 24px rgba(40,70,40,.3);display:grid;place-items:center}
.stop img{width:96px;height:96px;pointer-events:none}
.stop .n{position:absolute;top:-6px;right:-6px;width:46px;height:46px;border-radius:50%;background:var(--cream);color:var(--deep);font:800 28px/46px var(--font);text-align:center;box-shadow:0 4px 8px rgba(0,0,0,.15)}
.stop .lb{position:absolute;top:142px;left:50%;transform:translateX(-50%);white-space:nowrap;background:var(--cream);border-radius:999px;padding:5px 18px 8px;font:800 23px/1.1 var(--font);color:var(--deep);box-shadow:0 6px 12px rgba(47,90,62,.18)}
.stop.lock{filter:grayscale(.85) brightness(1.05);opacity:.6;cursor:default}
.stop.now{animation:bob 1.1s ease-in-out infinite}
.stop .st{position:absolute;bottom:-8px;left:-8px;width:52px;height:52px}

/* certificate */
.cert{position:absolute;right:70px;top:50%;transform:translateY(-50%);width:640px;background:var(--cream);border-radius:48px;padding:36px 48px 40px;box-sizing:border-box;text-align:center;
  display:flex;flex-direction:column;gap:8px;align-items:center;box-shadow:0 26px 60px rgba(30,60,40,.3),inset 0 -10px 0 rgba(120,100,60,.1),inset 0 8px 12px #fff;
  outline:6px dashed #E5CF9C;outline-offset:-22px;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
.cert h2{margin:6px 0 0;font:800 52px/1.1 var(--font);color:var(--deep)}
.cert .stars{display:flex;gap:6px}
.cert .stars img{width:58px;height:58px}
.cert .by{margin-top:10px;font:600 24px/1.3 var(--font);color:#6b7a6c}
.cert .name{font:800 40px/1.2 var(--font);color:var(--coral-d)}
.cert .cls{font:800 30px/1.2 var(--font);color:var(--deep)}
.cert .sch{font:600 21px/1.4 var(--font);color:#6b7a6c}
.cert .slogan{margin:8px 0 10px;font:800 26px/1.3 var(--font);color:var(--leaf)}

#rot[hidden],#load[hidden]{display:none!important}
#rot{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:rgba(207,228,228,.96);text-align:center;direction:rtl;z-index:5;padding:24px;box-sizing:border-box}
#rot p{margin:0;font:800 26px/1.4 var(--font);color:var(--deep)}
#rot .btn{font-size:22px;padding:12px 32px 16px}
#rot svg{width:90px;height:90px}
#load{position:absolute;inset:0;display:grid;place-items:center;font:800 28px var(--font);color:var(--deep)}

@keyframes pop{from{opacity:0;transform:translate(-50%,-50%) scale(.85)}}
.tag,.bubble,.toast{animation-name:pop2}
@keyframes pop2{from{opacity:0;scale:.8}}
.cert{animation-name:pop3}
@keyframes pop3{from{opacity:0;scale:.85}}
@keyframes bob{50%{translate:0 -8px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app">
  <canvas id="c" aria-label="لعبة رحلة دمعة اللبان"></canvas>
  <div id="ui"></div>
  <div id="load">جاري التحضير…</div>
  <div id="rot" hidden>
    <svg viewBox="0 0 64 64" fill="none" stroke="#2F5A3E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><rect x="20" y="6" width="24" height="40" rx="5"/><path d="M8 40a24 24 0 0 0 30 18"/><path d="M33 52l5 6-7 3"/></svg>
    <p>أدر الجهاز ليصير أفقياً،<br>لتكبر اللعبة.</p>
    <button class="btn" id="rotok" type="button">متابعة</button>
  </div>
</div>

<script>
(()=>{
'use strict';
const W=1280,H=720,SPR=2;
const app=document.getElementById('app'),cv=document.getElementById('c'),ctx=cv.getContext('2d'),ui=document.getElementById('ui');
const AR=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;

/* ---------------- random & colour ---------------- */
function rng(s){let a=(s*2654435761)>>>0||1;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hx(c){c=c.replace('#','');return[parseInt(c.slice(0,2),16),parseInt(c.slice(2,4),16),parseInt(c.slice(4,6),16)]}
function mix(a,b,t){const A=hx(a),B=hx(b);return'#'+A.map((v,i)=>clamp(Math.round(v+(B[i]-v)*t),0,255).toString(16).padStart(2,'0')).join('')}
function rgba(c,a){const A=hx(c);return`rgba(${A[0]},${A[1]},${A[2]},${a})`}
const Li=(c,t)=>mix(c,'#ffffff',t), Dk=(c,t)=>mix(c,'#22301f',t);

/* ---------------- textures ---------------- */
const NOISEC=(()=>{const c=document.createElement('canvas');c.width=c.height=160;const g=c.getContext('2d');const d=g.createImageData(160,160);
  for(let i=0;i<d.data.length;i+=4){const v=128+(Math.random()-.5)*170;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}g.putImageData(d,0,0);return c})();
const patCache=new WeakMap();
function noise(g){let p=patCache.get(g);if(!p){p=g.createPattern(NOISEC,'repeat');patCache.set(g,p)}return p}

/* ---------------- geometry ---------------- */
function ell(cx,cy,rx,ry,rot=0,n=44,wob=0,seed=1){
  const r=rng(seed),p1=r()*6.28,p2=r()*6.28,c=Math.cos(rot),s=Math.sin(rot),pts=[];
  for(let i=0;i<n;i++){const t=i/n*Math.PI*2,k=1+wob*(Math.sin(3*t+p1)*.6+Math.sin(5*t+p2)*.4);const x=Math.cos(t)*rx*k,y=Math.sin(t)*ry*k;pts.push([cx+x*c-y*s,cy+x*s+y*c])}
  return pts}
function rrp(x,y,w,h,r,n=6){const pts=[],cs=[[x+w-r,y+r,-Math.PI/2],[x+w-r,y+h-r,0],[x+r,y+h-r,Math.PI/2],[x+r,y+r,Math.PI]];
  for(const[cx,cy,a0]of cs)for(let i=0;i<=n;i++){const a=a0+Math.PI/2*i/n;pts.push([cx+Math.cos(a)*r,cy+Math.sin(a)*r])}return pts}
function smooth(pts){const out=[],n=pts.length,mid=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2];
  for(let i=0;i<n;i++){const a=mid(pts[(i-1+n)%n],pts[i]),c=pts[i],b=mid(pts[i],pts[(i+1)%n]);
    for(let k=0;k<6;k++){const t=k/6,u=1-t;out.push([u*u*a[0]+2*u*t*c[0]+t*t*b[0],u*u*a[1]+2*u*t*c[1]+t*t*b[1]])}}return out}
function pathOf(sp){const p=new Path2D();p.moveTo(sp[0][0],sp[0][1]);for(let i=1;i<sp.length;i++)p.lineTo(sp[i][0],sp[i][1]);p.closePath();return p}
function bbox(pts){let a=1e9,b=1e9,c=-1e9,d=-1e9;for(const[x,y]of pts){a=Math.min(a,x);b=Math.min(b,y);c=Math.max(c,x);d=Math.max(d,y)}return{x:a,y:b,w:c-a,h:d-b}}
function densify(sp,step){const out=[];for(let i=0;i<sp.length;i++){const a=sp[i],b=sp[(i+1)%sp.length],l=Math.hypot(b[0]-a[0],b[1]-a[1]),n=Math.max(1,Math.ceil(l/step));for(let k=0;k<n;k++)out.push([a[0]+(b[0]-a[0])*k/n,a[1]+(b[1]-a[1])*k/n])}return out}
function bez(p,t){const u=1-t;return[u*u*u*p[0]+3*u*u*t*p[2]+3*u*t*t*p[4]+t*t*t*p[6],u*u*u*p[1]+3*u*u*t*p[3]+3*u*t*t*p[5]+t*t*t*p[7]]}

/* ---------------- clay & felt rendering ---------------- */
function inner(g,path,bb,col,blur,ox,oy){g.save();g.shadowColor=col;g.shadowBlur=blur;g.shadowOffsetX=ox;g.shadowOffsetY=oy;
  const fr=new Path2D();fr.rect(bb.x-300,bb.y-300,bb.w+600,bb.h+600);fr.addPath(path);g.fillStyle='#000';g.fill(fr,'evenodd');g.restore()}
function clay(g,pts,base,o={}){
  const sp=o.raw?pts:smooth(pts),path=pathOf(sp),bb=bbox(sp),t=g.getTransform().a,sz=Math.max(bb.w,bb.h);
  g.save();
  if(o.shadow!==false){g.shadowColor=o.sc||'rgba(46,70,44,.26)';g.shadowBlur=(o.sb??Math.min(24,sz*.12+3))*t;g.shadowOffsetY=(o.sy??Math.min(11,sz*.05+1))*t;g.shadowOffsetX=(o.sx??0)*t}
  g.fillStyle=base;g.fill(path);g.restore();
  g.save();g.clip(path);
  const lg=g.createLinearGradient(bb.x,bb.y,bb.x+bb.w*.45,bb.y+bb.h);
  lg.addColorStop(0,Li(base,o.hi??.24));lg.addColorStop(.5,base);lg.addColorStop(1,mix(base,o.dk||'#2a3a2c',o.lo??.2));
  g.fillStyle=lg;g.fillRect(bb.x-1,bb.y-1,bb.w+2,bb.h+2);
  const k=Math.min(16,Math.max(1.2,sz*.05)),bl=Math.min(56,Math.max(2.5,sz*.17));
  inner(g,path,bb,`rgba(25,40,30,${o.id??.3})`,bl*t,-k*t,-k*t);
  inner(g,path,bb,`rgba(255,255,255,${o.il??.6})`,bl*.8*t,k*.7*t,k*.7*t);
  if(o.grain!==0){g.globalCompositeOperation='overlay';g.globalAlpha=o.grain??.2;g.fillStyle=noise(g);g.fillRect(bb.x,bb.y,bb.w,bb.h)}
  g.restore();
  return{path,sp,bb}}
function felt(g,pts,base,o={}){
  const{path,sp,bb}=clay(g,pts,base,{hi:.14,lo:.17,id:.22,il:.42,grain:.3,...o});
  const r=rng(o.seed||5),cx=bb.x+bb.w/2,cy=bb.y+bb.h/2;
  g.save();g.clip(path);g.lineCap='round';g.lineWidth=.55;
  const n=Math.min(1400,bb.w*bb.h/10),lt=rgba(Li(base,.55),.4),dk=rgba(Dk(base,.4),.2);
  for(let i=0;i<n;i++){const x=bb.x+r()*bb.w,y=bb.y+r()*bb.h,a=r()*6.28,l=1.4+r()*3.4;g.strokeStyle=r()<.5?lt:dk;g.beginPath();g.moveTo(x,y);
    g.quadraticCurveTo(x+Math.cos(a+1)*l*.6,y+Math.sin(a+1)*l*.6,x+Math.cos(a)*l,y+Math.sin(a)*l);g.stroke()}
  g.restore();
  if(o.fuzz===false)return;
  const shades=[Li(base,.3),Li(base,.12),base,Dk(base,.12),Dk(base,.24)];
  g.save();g.lineCap='round';
  for(const[x,y]of densify(sp,1.4)){const s=clamp(((x-cx)/(bb.w||1)+(y-cy)/(bb.h||1)),-1,1),col=shades[Math.round((s+1)*2)];
    for(let j=0;j<2;j++){const a=r()*6.28,l=.8+r()*(o.fl??3);g.lineWidth=.45+r()*.45;g.strokeStyle=rgba(col,.6);g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l);g.stroke()}}
  g.restore()}
function tmpLike(g){const c=document.createElement('canvas');c.width=g.canvas.width;c.height=g.canvas.height;const t=c.getContext('2d');t.setTransform(g.getTransform());return[c,t]}
function blit(g,c,alpha=1,filter=''){g.save();g.setTransform(1,0,0,1,0,0);g.globalAlpha=alpha;if(filter)g.filter=filter;g.drawImage(c,0,0);g.restore()}
function tubes(g,list,base,o={}){
  const segs=list.map(b=>{const n=18,pts=[];for(let i=0;i<=n;i++)pts.push(bez(b,i/n));return{pts,w0:b[8],w1:b[9]}});
  const t=g.getTransform().a;
